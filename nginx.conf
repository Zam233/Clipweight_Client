server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # SSE 长连接
    }

    location /renders/ {
        proxy_pass http://backend:8080;
    }

    location /voice_audio/ {
        proxy_pass http://backend:8080;
    }

    # F2: 账号/积分/市场服务（8090）——与 vite dev proxy 对齐；
    # 缺此代理时 Docker 化前端的登录、刷新、积分、市场上架全部失效
    location /srv/ {
        proxy_pass http://account-server:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
